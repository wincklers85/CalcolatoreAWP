<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWP Manager — Letture</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#f5f7fa;--fg:#1b1b1b;--muted:#5d6b7a;--card:#fff;--border:#dfe3ea;--acc:#007bff;--bad:#ef4444;--ok:#2ea043;--head:#eef2f7}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,Arial}body.theme-dark{--bg:#121417;--fg:#e4e7ec;--muted:#9aa3af;--card:#181b20;--border:#2a2f36;--head:#1c2128}.navbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0}.brand{color:var(--fg);text-decoration:none;font-weight:700}.nav a{color:var(--fg);text-decoration:none;margin:0 6px}.nav a[aria-current=page]{font-weight:700;text-decoration:underline}.right{display:flex;gap:8px}select,button,input{padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--fg)}button.primary{background:var(--acc);color:#fff}main{max-width:1280px;margin:auto;padding:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid var(--border);border-radius:10px;padding:10px}.value{font-size:22px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--border)}th{background:var(--head);text-align:left}.bad{color:var(--bad);font-weight:700}.meta{font-size:12px;color:var(--muted)}#loader{display:none;position:fixed;inset:0;background:#0002;align-items:center;justify-content:center}.spinner{width:48px;height:48px;border:5px solid #9995;border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="navbar"><a class="brand" href="./dashboard.html">AWP Manager</a><nav class="nav"><a href="./dashboard.html">Dashboard</a><a href="./letture.html" aria-current="page">Letture</a><a href="./allarmi.html">Allarmi</a><a href="./manutenzione.html">Manutenzione</a><a href="./anagrafica.html">Anagrafica</a></nav><div class="right"><select id="theme"><option value="">Chiaro</option><option value="theme-dark">Scuro</option></select><button id="refresh" class="primary">Aggiorna</button></div></div><main><div class="card"><h3>Filtri letture</h3><div class="controls"><label>Esattore / zona <select id="es"><option value="">— Tutti —</option></select></label><label>Giorni <input id="days" type="number" min="1" value="2" style="width:70px"></label><button id="apply" class="primary">Applica</button><button id="wa">WhatsApp</button><a href="./allarmi.html"><button>⚠️ Apri Allarmi</button></a><span class="meta" id="sin">Sinottico: —</span></div></div><div class="card"><div class="stats"><div class="stat"><div class="meta">Attive</div><div class="value" id="tot">—</div></div><div class="stat"><div class="meta">Da leggere</div><div class="value bad" id="alarm">—</div></div><div class="stat"><div class="meta">In regola</div><div class="value" id="ok">—</div></div><div class="stat"><div class="meta">Max giorni</div><div class="value" id="max">—</div></div></div></div><div class="card"><h3>Macchine da leggere</h3><div style="overflow:auto"><table><thead><tr><th>ESATTORE / ZONA</th><th>LOCALE</th><th>AWP</th><th>MODELLO</th><th>PDA</th><th>GIORNI</th><th>COMUNE</th></tr></thead><tbody id="tb"></tbody></table></div></div></main><div id="loader"><div class="spinner"></div></div><script>(function(){const urls=['./libs/xlsx.full.min.js','https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js'];function l(u){return new Promise((a,b)=>{let s=document.createElement('script');s.src=u;s.onload=a;s.onerror=b;document.head.appendChild(s)})}(async()=>{for(const u of urls){try{await l(u);if(XLSX)break}catch(_){}}})()})();</script><script>(function(){const $=s=>document.querySelector(s);let rows=[];function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').replace(/[^\w\s\-&']/g,'').trim().toUpperCase()}const ov=new Map([[norm('BAR MATCH SRLS'),'ALESSANDRO'],[norm('MAX BAR'),'SANREMO']]);function nes(es,sede){if(ov.has(norm(sede)))return ov.get(norm(sede));es=String(es||'').trim().toUpperCase();return es==='LUCA'?'SANREMO':(es||'—')}function pick(r,n){for(const k of n)if(r[k]!=null&&r[k]!=='')return r[k];return ''}function code(r){const ks=Object.keys(r),f=k=>String(k).toUpperCase().replace(/[^A-Z0-9]/g,'');let k=ks.find(k=>f(k)==='CODEID')||ks.find(k=>/COD(ICE)?ID/i.test(k))||ks.find(k=>/(SERIALE|MATRICOLA|AWP)/i.test(k));return k?String(r[k]||'').trim():''}function date(v){if(typeof v==='number'){const b=new Date(Date.UTC(1899,11,30)),d=new Date(b.getTime()+v*86400000);return new Date(d.getFullYear(),d.getMonth(),d.getDate())}let d=new Date(String(v||'').replace(/(\d{1,2})-(\d{1,2})-(\d{4})/,'$3-$2-$1'));return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate())}function days(d){if(!d)return Infinity;let t=new Date();t.setHours(0,0,0,0);return Math.floor((t-d)/86400000)}async function x(u){let r=await fetch(u,{cache:'no-store'}),ab=await r.arrayBuffer(),w=XLSX.read(ab,{type:'array'}),best=[];for(const n of w.SheetNames){let a=XLSX.utils.sheet_to_json(w.Sheets[n],{defval:null});if(a.length>best.length)best=a}return best}async function load(){ $('#loader').style.display='flex';try{while(!window.XLSX)await new Promise(r=>setTimeout(r,50));let m=await (await fetch('./Dati/manifest.json',{cache:'no-store'})).json(),name=m.sinottici.at(-1);$('#sin').textContent='Sinottico: '+name;let [sn,pdv,esj]=await Promise.all([x('./Dati/'+name),x('./Dati/PDV-e-ESATTORI.xlsx'),fetch('./Dati/esattori.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>[])]);let map=new Map();for(const r of pdv){let s=pick(r,['DENOMIN. SEDE','DENOMIN.SEDE','DENOMINAZIONE SEDE']);if(s)map.set(norm(s),nes(pick(r,['ESATTORE']),s))}for(const[k,v]of ov)map.set(k,v);rows=[];for(const r of sn){let st=String(pick(r,['DESCR. STATO','DESCR.STATO','STATO'])||'').toLowerCase().replace(/\s/g,'');if(st!=='attiva')continue;let id=code(r);if(!id)continue;let sede=pick(r,['DENOMIN. SEDE','DENOMIN.SEDE','DENOMINAZIONE SEDE']),d=date(pick(r,['DATA ULTIMA LETTURA VAL.','DATA ULTIMA LETTURA','ULTIMA LETTURA','DATA']));rows.push({id,sede,es:nes(map.get(norm(sede)),sede),g:days(d),mod:pick(r,['MODELLO','MOD','MODEL']),pda:pick(r,['PDA','COD.PDA','ID PDA','IDPDA']),com:pick(r,['COMUNE','CITTA','LOCALITA','CITTÀ'])})}let ess=[...new Set([...esj.map(e=>nes(e,'')),...rows.map(r=>r.es)].filter(e=>e&&e!=='—'&&e!=='LUCA'))].sort();$('#es').innerHTML='<option value="">— Tutti —</option>'+ess.map(e=>`<option>${e}</option>`).join('');render()}finally{$('#loader').style.display='none'}}function filt(){let n=+$('#days').value||2,e=$('#es').value;return rows.filter(r=>r.g>=n&&(!e||r.es===e)).sort((a,b)=>b.g-a.g)}function render(){let f=filt(),e=$('#es').value,base=e?rows.filter(r=>r.es===e):rows;$('#tb').innerHTML=f.map(r=>`<tr><td>${r.es}</td><td>${r.sede}</td><td>${r.id}</td><td>${r.mod||''}</td><td>${r.pda||''}</td><td class="bad">${isFinite(r.g)?r.g:'—'}</td><td>${r.com||''}</td></tr>`).join('');$('#tot').textContent=base.length;$('#alarm').textContent=f.length;$('#ok').textContent=Math.max(0,base.length-f.length);$('#max').textContent=base.length?Math.max(...base.map(r=>isFinite(r.g)?r.g:0)):0}function wa(){let f=filt(),by={};for(const r of f)(by[r.es]??=[]).push(r);let s=[];for(const e of Object.keys(by).sort()){s.push('*'+e+'*');for(const r of by[e])s.push(`${r.sede} - ${r.mod||r.id} (${r.g} gg)`);s.push('')}window.open('https://wa.me/?text='+encodeURIComponent(s.join('\n')),'_blank')}$('#apply').onclick=render;$('#es').onchange=render;$('#wa').onclick=wa;$('#refresh').onclick=load;$('#theme').onchange=e=>{document.body.className=e.target.value;localStorage.setItem('awp_theme',e.target.value)};window.onload=()=>{let t=localStorage.getItem('awp_theme')||'';document.body.className=t;$('#theme').value=t;load()}})();</script></body></html>
