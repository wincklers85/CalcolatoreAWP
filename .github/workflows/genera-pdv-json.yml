name: Genera anagrafica PDV JSON

on:
  push:
    branches: [main]
    paths:
      - 'Dati/PDV-e-ESATTORI.xlsx'
      - 'tools/genera_pdv_json.py'
      - 'tools/usa_pdv_json.py'
      - '.github/workflows/genera-pdv-json.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  genera-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python tools/genera_pdv_json.py
      - run: python tools/usa_pdv_json.py
      - name: Commit anagrafica e pagine aggiornate
        run: |
          if [ -z "$(git status --porcelain -- Dati/PDV-e-ESATTORI.json dashboard.html letture.html manutenzione.html anagrafica.html letture1.html allarmi.html)" ]; then
            echo 'Anagrafica e pagine già aggiornate'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dati/PDV-e-ESATTORI.json dashboard.html letture.html manutenzione.html anagrafica.html letture1.html allarmi.html
          git commit -m 'Usa anagrafica PDV JSON nelle pagine'
          git push
