<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWP Manager — Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#f5f7fa;--fg:#1b1b1b;--muted:#5d6b7a;--card:#fff;--border:#dfe3ea;--acc:#007bff;--ok:#2ea043;--bad:#ef4444;--head:#eef2f7}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,Arial}body.theme-dark{--bg:#121417;--fg:#e4e7ec;--muted:#9aa3af;--card:#181b20;--border:#2a2f36;--head:#1c2128}.navbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0}.brand{color:var(--fg);text-decoration:none;font-weight:700}.nav a{color:var(--fg);text-decoration:none;margin:0 6px}.nav a[aria-current=page]{font-weight:700;text-decoration:underline}select,button{padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--fg)}button.primary{background:var(--acc);color:#fff}main{max-width:1200px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}.span{grid-column:1/-1}.k{font-size:30px;font-weight:800}.ok{color:var(--ok)}.bad{color:var(--bad)}.meta{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--border)}th{background:var(--head);text-align:left}.bar{height:12px;background:var(--head);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}#loader{display:none;position:fixed;inset:0;background:#0002;align-items:center;justify-content:center}.spinner{width:48px;height:48px;border:5px solid #9995;border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="navbar"><a class="brand" href="./dashboard.html">AWP Manager</a><nav class="nav"><a href="./dashboard.html" aria-current="page">Dashboard</a><a href="./letture.html">Letture</a><a href="./allarmi.html">Allarmi</a><a href="./manutenzione.html">Manutenzione</a><a href="./anagrafica.html">Anagrafica</a></nav><div><select id="theme"><option value="">Chiaro</option><option value="theme-dark">Scuro</option></select> <button id="refresh" class="primary">Aggiorna</button></div></div><main><div class="grid"><div class="card"><div class="meta">Totale macchine attive</div><div class="k" id="tot">—</div></div><div class="card"><div class="meta">Aggiornate oggi</div><div class="k ok" id="today">—</div></div><div class="card"><div class="meta">Mancate letture</div><div class="k bad" id="bad">—</div></div><div class="card"><div class="meta">Sinottico</div><div class="k" style="font-size:16px" id="sin">—</div></div><div class="card span"><h3>Aggiornate per esattore / zona</h3><div id="bars"></div></div><div class="card span"><h3>Criticità</h3><div style="overflow:auto"><table><thead><tr><th>ESATTORE / ZONA</th><th>ATTIVE</th><th>OGGI</th><th>MANCATE</th><th>%</th></tr></thead><tbody id="tb"></tbody></table></div></div></div></main><div id="loader"><div class="spinner"></div></div><script>(function(){const urls=['./libs/xlsx.full.min.js','https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js'];function l(u){return new Promise((a,b)=>{let s=document.createElement('script');s.src=u;s.onload=a;s.onerror=b;document.head.appendChild(s)})}(async()=>{for(const u of urls){try{await l(u);if(XLSX)break}catch(_){}}})()})();</script><script>(function(){const $=s=>document.querySelector(s);function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').replace(/[^\w\s\-&']/g,'').trim().toUpperCase()}const ov=new Map([[norm('BAR MATCH SRLS'),'ALESSANDRO'],[norm('MAX BAR'),'SANREMO']]);function nes(es,sede){if(ov.has(norm(sede)))return ov.get(norm(sede));es=String(es||'').trim().toUpperCase();return es==='LUCA'?'SANREMO':(es||'—')}function pick(r,n){for(const k of n)if(r[k]!=null&&r[k]!=='')return r[k];return ''}function date(v){if(typeof v==='number'){const b=new Date(Date.UTC(1899,11,30)),d=new Date(b.getTime()+v*86400000);return new Date(d.getFullYear(),d.getMonth(),d.getDate())}let d=new Date(String(v||'').replace(/(\d{1,2})-(\d{1,2})-(\d{4})/,'$3-$2-$1'));return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate())}async function x(u){let r=await fetch(u,{cache:'no-store'}),ab=await r.arrayBuffer(),w=XLSX.read(ab,{type:'array'}),best=[];for(const n of w.SheetNames){let a=XLSX.utils.sheet_to_json(w.Sheets[n],{defval:null});if(a.length>best.length)best=a}return best}async function load(){$('#loader').style.display='flex';try{while(!window.XLSX)await new Promise(r=>setTimeout(r,50));let m=await (await fetch('./Dati/manifest.json',{cache:'no-store'})).json(),name=m.sinottici.at(-1);$('#sin').textContent=name;let [sn,pdv]=await Promise.all([x('./Dati/'+name),x('./Dati/PDV-e-ESATTORI.xlsx')]);let map=new Map();for(const r of pdv){let s=pick(r,['DENOMIN. SEDE','DENOMIN.SEDE','DENOMINAZIONE SEDE']);if(s)map.set(norm(s),nes(pick(r,['ESATTORE']),s))}for(const[k,v]of ov)map.set(k,v);let t=new Date();t.setHours(0,0,0,0);let by={};for(const r of sn){let st=String(pick(r,['DESCR. STATO','DESCR.STATO','STATO'])||'').toLowerCase().replace(/\s/g,'');if(st!=='attiva')continue;let sede=pick(r,['DENOMIN. SEDE','DENOMIN.SEDE','DENOMINAZIONE SEDE']),es=nes(map.get(norm(sede)),sede),d=date(pick(r,['DATA ULTIMA LETTURA VAL.','DATA ULTIMA LETTURA','ULTIMA LETTURA','DATA']));let oggi=!!d&&d.getTime()===t.getTime();if(!by[es])by[es]={tot:0,oggi:0};by[es].tot++;if(oggi)by[es].oggi++}let keys=Object.keys(by).filter(k=>k!=='LUCA').sort();let total=keys.reduce((s,k)=>s+by[k].tot,0),oggi=keys.reduce((s,k)=>s+by[k].oggi,0);$('#tot').textContent=total;$('#today').textContent=oggi;$('#bad').textContent=total-oggi;$('#tb').innerHTML=keys.map(k=>{let a=by[k],p=a.tot?Math.round(a.oggi/a.tot*100):0;return `<tr><td>${k}</td><td>${a.tot}</td><td>${a.oggi}</td><td class="bad">${a.tot-a.oggi}</td><td>${p}%</td></tr>`}).join('');$('#bars').innerHTML=keys.map(k=>{let a=by[k],p=a.tot?Math.round(a.oggi/a.tot*100):0;return `<div style="margin:10px 0"><div><strong>${k}</strong> <span class="meta">${a.oggi}/${a.tot} — ${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}finally{$('#loader').style.display='none'}}$('#refresh').onclick=load;$('#theme').onchange=e=>{document.body.className=e.target.value;localStorage.setItem('awp_theme',e.target.value)};window.onload=()=>{let t=localStorage.getItem('awp_theme')||'';document.body.className=t;$('#theme').value=t;load()}})();</script></body></html>
